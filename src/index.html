  <!-- Applique le thème (jour / nuit) et le choix des animations avant l'affichage, pour éviter un flash. -->
  <script>
    (function () {
      var racine = document.documentElement, theme = null, mouvement = null;
      try {
        theme = localStorage.getItem('weimin-theme');
        mouvement = localStorage.getItem('weimin-motion');
      } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      racine.setAttribute('data-theme', theme);
      var anime = mouvement ? mouvement === 'on' : !matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (anime) racine.classList.add('motion-ok');
    })();
  </script>
